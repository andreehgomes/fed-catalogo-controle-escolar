<!--
  Shell do app. Não usa `mat-drawer`: o Material não tem o estado "aberto e
  fixo" que o rail de 76px exige — `mode="over"` sempre sobrepõe e escurece o
  resto. Aqui o `<aside>` é um irmão do conteúdo, e só vira drawer sobreposto
  abaixo de 900px.

  O scroll é interno (`.ce-content`), não do `body`. É isso que mantém o header
  no topo sem `position: fixed`.

  Rotas sem shell (login, nova conta, redefinir senha, erro e campanha pública
  `c/:key`) escondem o `<aside>` e o header via `showBtnMenu=false`.
-->
<div class="ce-shell" [class.sem-shell]="!showBtnMenu">
  <ng-container *ngIf="showBtnMenu">
    <aside
      class="ce-nav"
      [class.expandido]="expanded"
      [class.rail]="rail"
    >
      <div class="ce-nav-header">
        <div class="ce-nav-logo">
          <mat-icon>school</mat-icon>
        </div>
        <div class="ce-nav-brand">
          <span class="ce-nav-brand-name">Campanhas</span>
          <span class="ce-nav-brand-tag">Controle Escolar</span>
        </div>
      </div>

      <ng-container *ngIf="isLogged$ | async as isLogged; else notLogged">
        <nav class="ce-nav-list">
          <button
            type="button"
            class="ce-nav-item"
            [matTooltip]="rail ? 'Página inicial' : ''"
            matTooltipPosition="right"
            (click)="goTo()"
          >
            <mat-icon>home</mat-icon>
            <span class="ce-nav-label">Página inicial</span>
          </button>

          <ng-container *ngIf="!isEstagiario">
            <div class="ce-nav-group">Campanhas</div>

            <button
              type="button"
              class="ce-nav-item"
              [matTooltip]="rail ? 'Nova campanha' : ''"
              matTooltipPosition="right"
              (click)="goTo(routes.NEW_CAMPAIGN)"
            >
              <mat-icon>campaign</mat-icon>
              <span class="ce-nav-label">Nova campanha</span>
            </button>

            <button
              type="button"
              class="ce-nav-item"
              [matTooltip]="rail ? 'Listar campanhas' : ''"
              matTooltipPosition="right"
              (click)="goTo(routes.CAMPAIGN_LIST)"
            >
              <mat-icon>list_alt</mat-icon>
              <span class="ce-nav-label">Listar campanhas</span>
            </button>

            <button
              type="button"
              class="ce-nav-item"
              [matTooltip]="rail ? 'Nova despesa' : ''"
              matTooltipPosition="right"
              (click)="goTo(routes.NEW_EXPENSE)"
            >
              <mat-icon>add_card</mat-icon>
              <span class="ce-nav-label">Nova despesa</span>
            </button>

            <button
              type="button"
              class="ce-nav-item"
              [matTooltip]="rail ? 'Despesas' : ''"
              matTooltipPosition="right"
              (click)="goTo(routes.EXPENSE_LIST)"
            >
              <mat-icon>receipt</mat-icon>
              <span class="ce-nav-label">Despesas</span>
            </button>

            <div class="ce-nav-group">Vendas &amp; Clientes</div>

            <button
              type="button"
              class="ce-nav-item"
              [matTooltip]="rail ? 'Nova venda' : ''"
              matTooltipPosition="right"
              (click)="goTo(routes.NEW_SALE)"
            >
              <mat-icon>point_of_sale</mat-icon>
              <span class="ce-nav-label">Nova venda</span>
            </button>

            <button
              type="button"
              class="ce-nav-item"
              [matTooltip]="rail ? 'Listar vendas' : ''"
              matTooltipPosition="right"
              (click)="goTo(routes.SALE_LIST)"
            >
              <mat-icon>receipt_long</mat-icon>
              <span class="ce-nav-label">Listar vendas</span>
            </button>

            <button
              type="button"
              class="ce-nav-item"
              [matTooltip]="rail ? 'Contas a receber' : ''"
              matTooltipPosition="right"
              (click)="goTo(routes.CONTAS_A_RECEBER)"
            >
              <mat-icon>request_quote</mat-icon>
              <span class="ce-nav-label">Contas a receber</span>
            </button>

            <button
              type="button"
              class="ce-nav-item"
              [matTooltip]="rail ? 'Recebimentos' : ''"
              matTooltipPosition="right"
              (click)="goTo(routes.LISTAR_RECEBIMENTOS)"
            >
              <mat-icon>payments</mat-icon>
              <span class="ce-nav-label">Recebimentos</span>
            </button>
          </ng-container>

          <ng-container *ngIf="isEstagiario">
            <div class="ce-nav-group">Operação</div>
          </ng-container>

          <button
            type="button"
            class="ce-nav-item"
            [matTooltip]="rail ? 'Entregas' : ''"
            matTooltipPosition="right"
            (click)="goTo(routes.ENTREGA_LIST)"
          >
            <mat-icon>local_shipping</mat-icon>
            <span class="ce-nav-label">Entregas</span>
          </button>

          <ng-container *ngIf="!isEstagiario">
            <button
              type="button"
              class="ce-nav-item"
              [matTooltip]="rail ? 'Novo cliente' : ''"
              matTooltipPosition="right"
              (click)="goTo(routes.NEW_CLIENT)"
            >
              <mat-icon>person_add</mat-icon>
              <span class="ce-nav-label">Novo cliente</span>
            </button>

            <button
              type="button"
              class="ce-nav-item"
              [matTooltip]="rail ? 'Clientes' : ''"
              matTooltipPosition="right"
              (click)="goTo(routes.CLIENT_LIST)"
            >
              <mat-icon>people</mat-icon>
              <span class="ce-nav-label">Clientes</span>
            </button>

            <div class="ce-nav-group">Gestão</div>

            <button
              type="button"
              class="ce-nav-item"
              [matTooltip]="rail ? 'Dashboard' : ''"
              matTooltipPosition="right"
              (click)="goTo(routes.DASHBOARD)"
            >
              <mat-icon>dashboard</mat-icon>
              <span class="ce-nav-label">Dashboard</span>
            </button>

            <button
              type="button"
              class="ce-nav-item"
              [matTooltip]="rail ? 'Cadastro de usuário' : ''"
              matTooltipPosition="right"
              (click)="goTo(routes.NEW_ACCOUNT)"
            >
              <mat-icon>manage_accounts</mat-icon>
              <span class="ce-nav-label">Cadastro de usuário</span>
            </button>

            <button
              *ngIf="isMaster"
              type="button"
              class="ce-nav-item"
              [matTooltip]="rail ? 'Usuários' : ''"
              matTooltipPosition="right"
              (click)="goTo(routes.ACCOUNT_LIST)"
            >
              <mat-icon>group</mat-icon>
              <span class="ce-nav-label">Usuários</span>
            </button>
          </ng-container>

          <button
            type="button"
            class="ce-nav-item ce-nav-item--auth"
            [matTooltip]="rail ? 'Sair' : ''"
            matTooltipPosition="right"
            (click)="logout(routes.LOGIN)"
          >
            <mat-icon>logout</mat-icon>
            <span class="ce-nav-label">Sair</span>
          </button>
        </nav>
      </ng-container>

      <ng-template #notLogged>
        <nav class="ce-nav-list">
          <button
            type="button"
            class="ce-nav-item ce-nav-item--auth"
            [matTooltip]="rail ? 'Entrar' : ''"
            matTooltipPosition="right"
            (click)="goTo(routes.LOGIN)"
          >
            <mat-icon>login</mat-icon>
            <span class="ce-nav-label">Entrar</span>
          </button>
        </nav>
      </ng-template>

      <div class="ce-nav-footer">
        <span class="ce-nav-footer-label">Controle de Campanhas</span>
        <span class="ce-nav-footer-tag">Escolares</span>
      </div>
    </aside>

    <!-- Só captura clique quando o drawer está aberto em tela estreita. -->
    <div
      class="ce-scrim"
      [class.ativo]="narrow && expanded"
      (click)="fecharNav()"
    ></div>
  </ng-container>

  <main class="ce-main">
    <header class="ce-header" *ngIf="showBtnMenu">
      <button
        type="button"
        class="ce-header-btn"
        aria-label="Abrir menu"
        (click)="alternarNav()"
      >
        <mat-icon>menu</mat-icon>
      </button>

      <span class="ce-header-title">Campanhas Escolares</span>

      <span class="ce-header-spacer"></span>

      <div class="ce-header-user" *ngIf="isLogged$ | async">
        <span class="ce-header-avatar">
          <mat-icon>school</mat-icon>
        </span>
        <span class="ce-header-user-label">Escola</span>
      </div>
    </header>

    <div class="ce-content">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
