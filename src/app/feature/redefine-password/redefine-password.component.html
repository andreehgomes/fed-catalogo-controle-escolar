<!--
  Redefine-password fica fora do shell (ver AppComponent.outOfShellPrefixes).
  Mesmo molde do login: viewport inteira, gradiente de marca ao fundo,
  card claro ao centro.
-->
<div class="redefine-page">
  <div class="redefine-container">
    <div class="logo-wrapper">
      <img
        src="../../../assets/imagens/logo.png"
        alt="Controle de Campanhas Escolares"
        class="logo"
      />
      <div class="brand">
        <span class="brand-eyebrow">Redefinir senha</span>
        <span class="brand-name">Esqueceu sua senha?</span>
      </div>
    </div>

    <div class="form-card">
      <p class="intro">
        Informe o e-mail da sua conta. Enviaremos um link para você criar
        uma nova senha.
      </p>

      <div class="alert-block" *ngIf="mensagemRedefinirSenha?.codigo != null">
        <card-alert
          tipo="{{ mensagemRedefinirSenha.tipo }}"
          codigo="{{ mensagemRedefinirSenha.codigo }}"
          mensagem="{{ mensagemRedefinirSenha.mensagem }}"
        ></card-alert>
      </div>

      <form
        [formGroup]="formControlNewPass"
        (ngSubmit)="onSubmit()"
        class="form"
        #formDirective="ngForm"
      >
        <label class="ce-field">
          <span>E-mail</span>
          <input
            type="email"
            formControlName="email"
            autocomplete="email"
          />
        </label>

        <button
          type="submit"
          class="ce-btn-primary btn-enviar"
          [disabled]="formControlNewPass.invalid"
        >
          <mat-icon>send</mat-icon>
          Enviar e-mail
        </button>

        <div class="links">
          <a class="link" [routerLink]="['/' + route.LOGIN]">
            Voltar para o login
          </a>
        </div>
      </form>
    </div>
  </div>
</div>
