<section class="ce-page ce-page--form new-expense">
  <header class="ce-page-header">
    <div class="ce-page-title">
      <h1>{{ editingKey ? 'Editar despesa' : 'Nova despesa' }}</h1>
      <span class="ce-page-subtitle">
        {{ editingKey
          ? 'Ajuste os dados ou o comprovante da despesa.'
          : 'Preencha os campos abaixo para registrar uma nova despesa.' }}
      </span>
    </div>
  </header>

  <form [formGroup]="form" class="ce-panel new-expense-form" (ngSubmit)="salvar()">
    <div class="alert-block" *ngIf="alerta?.codigo != null">
      <card-alert
        tipo="{{ alerta.tipo }}"
        codigo="{{ alerta.codigo }}"
        mensagem="{{ alerta.mensagem }}"
      ></card-alert>
    </div>

    <!-- ─── Comprovante ────────────────────────────────────────────────── -->
    <div class="ne-section">
      <span class="ce-label">Comprovante</span>

      <div class="ne-dropzone" [class.ne-dropzone--empty]="!comprovantePreview">
        <img *ngIf="comprovantePreview" [src]="comprovantePreview" alt="Comprovante" />

        <button
          *ngIf="!comprovantePreview"
          type="button"
          class="ce-btn-primary ne-btn-upload"
          (click)="clickInputImage()"
        >
          <mat-icon>add_a_photo</mat-icon>
          Anexar imagem
        </button>

        <div class="ne-dropzone-actions" *ngIf="comprovantePreview">
          <button
            type="button"
            class="ce-btn-icon"
            matTooltip="Trocar"
            aria-label="Trocar comprovante"
            (click)="clickInputImage()"
          >
            <mat-icon>edit</mat-icon>
          </button>
          <button
            type="button"
            class="ce-btn-icon ne-btn-remove"
            matTooltip="Remover"
            aria-label="Remover comprovante"
            (click)="removerComprovante()"
          >
            <mat-icon>delete</mat-icon>
          </button>
        </div>
      </div>

      <input
        #inputImage
        type="file"
        accept="image/*"
        hidden
        (change)="selectFile($event)"
      />
    </div>

    <!-- ─── Dados da despesa ──────────────────────────────────────────── -->
    <div class="ne-fields">
      <mat-form-field appearance="outline" subscriptSizing="dynamic" class="ne-field">
        <mat-label>Campanha</mat-label>
        <mat-icon matPrefix>campaign</mat-icon>
        <mat-select formControlName="campaignKey">
          <mat-option *ngFor="let c of campaigns" [value]="c.key">{{ c.nome }}</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline" subscriptSizing="dynamic" class="ne-field">
        <mat-label>Descrição</mat-label>
        <input matInput formControlName="descricao" autocomplete="off" />
      </mat-form-field>

      <div class="ne-row-2">
        <div class="ne-field-valor">
          <input-moeda formControlName="valor" label="Valor" />
        </div>

        <mat-form-field appearance="outline" subscriptSizing="dynamic" class="ne-field">
          <mat-label>Data</mat-label>
          <mat-icon matPrefix>calendar_today</mat-icon>
          <input matInput type="date" formControlName="data" />
        </mat-form-field>
      </div>
    </div>

    <div class="ce-form-actions ne-actions">
      <button type="button" class="ce-btn-ghost" (click)="cancelar()">
        Cancelar
      </button>
      <button
        type="submit"
        class="ce-btn-primary"
        [disabled]="form.invalid"
      >
        <mat-icon>save</mat-icon>
        {{ editingKey ? 'Salvar alterações' : 'Salvar despesa' }}
      </button>
    </div>
  </form>
</section>
