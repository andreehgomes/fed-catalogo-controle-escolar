<section class="ce-page ce-page--form new-client">
  <header class="ce-page-header">
    <div class="ce-page-title">
      <h1>{{ editingKey ? 'Editar cliente' : 'Novo cliente' }}</h1>
      <span class="ce-page-subtitle">
        {{ editingKey
          ? 'Ajuste o nome ou o telefone do cliente.'
          : 'Preencha os campos abaixo para cadastrar um novo cliente.' }}
      </span>
    </div>
  </header>

  <form [formGroup]="form" class="ce-panel new-client-form" (ngSubmit)="salvar()">
    <div class="alert-block" *ngIf="alerta?.codigo != null">
      <card-alert
        tipo="{{ alerta.tipo }}"
        codigo="{{ alerta.codigo }}"
        mensagem="{{ alerta.mensagem }}"
      ></card-alert>
    </div>

    <div class="nc-fields">
      <mat-form-field appearance="outline" subscriptSizing="dynamic" class="nc-field">
        <mat-label>Nome</mat-label>
        <mat-icon matPrefix>person</mat-icon>
        <input matInput formControlName="nome" autocomplete="off" />
      </mat-form-field>

      <mat-form-field appearance="outline" subscriptSizing="dynamic" class="nc-field">
        <mat-label>Telefone (opcional)</mat-label>
        <mat-icon matPrefix>phone</mat-icon>
        <input matInput formControlName="telefone" autocomplete="off" />
      </mat-form-field>
    </div>

    <div class="ce-form-actions nc-actions">
      <button type="button" class="ce-btn-ghost" (click)="cancelar()">
        Cancelar
      </button>
      <button
        type="submit"
        class="ce-btn-primary"
        [disabled]="form.invalid"
      >
        <mat-icon>save</mat-icon>
        {{ editingKey ? 'Salvar alterações' : 'Salvar cliente' }}
      </button>
    </div>
  </form>
</section>
