<!--
  Login fica fora do shell (ver AppComponent.outOfShellPrefixes). Ocupa a
  viewport inteira, com o gradiente da marca ao fundo e um card claro central.
-->
<div class="login-page">
  <div class="login-container">
    <div class="logo-wrapper">
      <img
        src="../../../assets/imagens/logo.png"
        alt="Controle de Campanhas Escolares"
        class="logo"
      />
      <div class="brand">
        <span class="brand-eyebrow">Controle de Campanhas</span>
        <span class="brand-name">Escolares</span>
      </div>
    </div>

    <div class="form-card">
      <div class="alert-block" *ngIf="mensagemRespostaLogin?.codigo != null">
        <card-alert
          tipo="{{ mensagemRespostaLogin.tipo }}"
          codigo="{{ mensagemRespostaLogin.codigo }}"
          mensagem="{{ mensagemRespostaLogin.mensagem }}"
        ></card-alert>
      </div>

      <form
        #form="ngForm"
        [formGroup]="formControlUsuario"
        (ngSubmit)="onSubmitLogin()"
        class="form"
      >
        <!--
          `<label>` real envolvendo o `<input>`: mantém `getByLabel("E-mail")`
          dos e2e funcionando sem depender de `mat-form-field`.
        -->
        <label class="ce-field">
          <span>E-mail</span>
          <input
            type="email"
            formControlName="emailFormGroup"
            autocomplete="email"
          />
        </label>

        <label class="ce-field">
          <span>Senha</span>
          <input
            type="password"
            formControlName="senhaFormGroup"
            autocomplete="current-password"
          />
        </label>

        <button type="submit" class="ce-btn-primary btn-entrar">Entrar</button>

        <div class="links">
          <a class="link" (click)="newPassword()">Esqueci minha senha</a>
        </div>
      </form>
    </div>
  </div>
</div>
