<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Controle de Campanhas Escolares</title>
    <base href="/" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="./assets/imagens/logo.png" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <style type="text/css">
      /* Canvas claro do redesign — remove o gradiente escuro antigo. */
      html, body { margin: 0; background: #f4f6fb; }

      #splash-screen {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(168deg, #0b1f3f 0%, #112a52 55%, #1a3f7a 100%);
        animation: splashFadeOut 0.7s ease forwards 1.8s;
      }

      #splash-screen img {
        width: 280px;
        opacity: 0.3;
      }

      @keyframes splashFadeOut {
        to {
          opacity: 0;
          visibility: hidden;
          pointer-events: none;
        }
      }
    </style>

    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="splash-screen">
      <img src="./assets/imagens/logo.png" alt="Logo" />
    </div>
    <app-root></app-root>
  </body>
</html>
